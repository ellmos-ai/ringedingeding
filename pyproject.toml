[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ringedingeding"
version = "0.1.0"
description = "Ask one question to several people by phone and merge the answers into one result. Built on CALL-E."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["call-e", "phone", "voice-agent", "poll", "scheduling"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

# No runtime dependencies on purpose: the dry run has to work on a machine with
# nothing installed and no network. The live path speaks the documented HTTP API
# through the standard library.
dependencies = []

[project.optional-dependencies]
# The web interface is optional on purpose: the command line and the dry run
# must keep working on a machine with nothing installed. htmx is vendored into
# the package, so there is no CDN, no npm and no build step here either.
web = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
ringedingeding = "ringedingeding.cli:main"

[tool.setuptools]
packages = ["ringedingeding", "ringedingeding.transports", "ringedingeding.web"]

[tool.setuptools.package-data]
ringedingeding = [
  "fixtures/*.json",
  "web/templates/*.html",
  "web/static/*.css",
  "web/static/*.js",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
